name: CI

on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  validate:
    name: Validate and export
    runs-on: ubuntu-latest
    timeout-minutes: 25
    env:
      CI: true
      EXPO_NO_TELEMETRY: 1

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Node.js
        uses: actions/setup-node@v7
        with:
          node-version-file: .nvmrc
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Run game tests
        run: npm run check:game

      - name: Run lint
        run: npm run lint

      - name: Run TypeScript checks
        run: npm run typecheck

      - name: Check Expo dependencies
        run: npm run check:expo

      - name: Audit production dependencies
        run: npm run audit:ci

      - name: Validate Expo configuration
        run: npx expo config --type public > /dev/null

      - name: Export web bundle
        run: npm run export:web

      - name: Export iOS bundle
        run: npm run export:ios

      - name: Export Android bundle
        run: npm run export:android

      - name: Upload web artifact
        uses: actions/upload-artifact@v4
        with:
          name: english-comeback-web-${{ github.sha }}
          path: dist/web
          if-no-files-found: error
          retention-days: 7
